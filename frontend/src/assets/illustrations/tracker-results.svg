<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="trackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" rx="20" fill="url(#trackBg)"/>

  <!-- Accuracy Gauge & Card -->
  <g transform="translate(45, 45)">
    <rect width="230" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.05))"/>

    <!-- Accuracy Arc -->
    <path d="M75 110 A 45 45 0 0 1 155 110" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round"/>
    <path d="M75 110 A 45 45 0 0 1 145 75" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
    <circle cx="115" cy="110" r="6" fill="#1E293B"/>
    <line x1="115" y1="110" x2="135" y2="82" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

    <!-- Score Label -->
    <rect x="95" y="125" width="40" height="14" rx="4" fill="#EFF6FF"/>
    <rect x="100" y="129" width="30" height="6" rx="3" fill="#3B82F6"/>

    <!-- Timeline verification rows -->
    <g transform="translate(165, 35)">
      <!-- Row 1: Hit (Tick) -->
      <circle cx="10" cy="15" r="9" fill="#DCFCE7"/>
      <path d="M6 15 L9 18 L15 12" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="12" width="28" height="6" rx="3" fill="#64748B"/>

      <!-- Row 2: Usual (Cross) -->
      <circle cx="10" cy="45" r="9" fill="#F1F5F9"/>
      <path d="M7 42 L13 48 M13 42 L7 48" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <rect x="26" y="42" width="24" height="6" rx="3" fill="#94A3B8"/>

      <!-- Row 3: Hit (Tick) -->
      <circle cx="10" cy="75" r="9" fill="#DCFCE7"/>
      <path d="M6 75 L9 78 L15 72" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="72" width="30" height="6" rx="3" fill="#64748B"/>
    </g>
  </g>
</svg>

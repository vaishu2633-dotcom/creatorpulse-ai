<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <!-- Friendly Connect Accounts Illustration -->
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B5BD6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="20" fill="url(#connBg)"/>

  <!-- Central Hub Node -->
  <g transform="translate(160, 110)">
    <circle cx="0" cy="0" r="32" fill="#5B5BD6" filter="drop-shadow(0 8px 16px rgba(91,91,214,0.25))"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6" fill="#14B8A6"/>
  </g>

  <!-- Connected Platform Satellite Nodes -->
  <!-- Top Node (YouTube) -->
  <line x1="160" y1="110" x2="160" y2="45" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="160" cy="45" r="22" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.06))"/>
  <polygon points="156,38 167,45 156,52" fill="#EF4444"/>

  <!-- Right Node (Instagram) -->
  <line x1="160" y1="110" x2="245" y2="110" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="245" cy="110" r="22" fill="#FFFFFF" stroke="#EC4899" stroke-width="2" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.06))"/>
  <rect x="237" y="102" width="16" height="16" rx="4" stroke="#EC4899" stroke-width="2" fill="none"/>
  <circle cx="245" cy="110" r="3.5" stroke="#EC4899" stroke-width="1.5" fill="none"/>

  <!-- Bottom Node (LinkedIn) -->
  <line x1="160" y1="110" x2="160" y2="175" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="160" cy="175" r="22" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.06))"/>
  <text x="160" y="181" font-size="14" font-family="system-ui" font-weight="bold" fill="#3B82F6" text-anchor="middle">in</text>

  <!-- Left Node (X) -->
  <line x1="160" y1="110" x2="75" y2="110" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="75" cy="110" r="22" fill="#FFFFFF" stroke="#1F2430" stroke-width="2" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.06))"/>
  <text x="75" y="116" font-size="14" font-family="system-ui" font-weight="900" fill="#1F2430" text-anchor="middle">𝕏</text>

  <!-- Sparkles -->
  <circle cx="110" cy="55" r="4" fill="#F59E0B"/>
  <circle cx="225" cy="165" r="5" fill="#14B8A6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="vibeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5B5BD6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" rx="20" fill="url(#vibeBg)"/>

  <!-- Sentiment gauge card -->
  <g transform="translate(45, 45)">
    <rect width="130" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.05))"/>
    
    <!-- Semi-circle radial arc -->
    <path d="M 25 80 A 40 40 0 0 1 105 80" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
    <path d="M 25 80 A 40 40 0 0 1 95 50" fill="none" stroke="url(#gaugeGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Gauge needle -->
    <line x1="65" y1="80" x2="88" y2="56" stroke="#1F2430" stroke-width="3" stroke-linecap="round"/>
    <circle cx="65" cy="80" r="5" fill="#1F2430"/>

    <text x="65" y="112" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#1F2430">92% Vibe</text>
    <text x="65" y="130" text-anchor="middle" font-family="system-ui" font-size="10" font-weight="500" fill="#14B8A6">Enthusiastic</text>
  </g>

  <!-- Floating comment speech bubble with sentiment pulse -->
  <g transform="translate(185, 55)">
    <rect width="95" height="55" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.04))"/>
    <path d="M 25 55 L 25 65 L 35 55 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="14" width="70" height="6" rx="3" fill="#10B981" fill-opacity="0.8"/>
    <rect x="12" y="26" width="50" height="6" rx="3" fill="#94A3B8" fill-opacity="0.5"/>
    <rect x="12" y="38" width="30" height="5" rx="2.5" fill="#5B5BD6" fill-opacity="0.7"/>
  </g>

  <!-- Sparkle & wave indicators -->
  <g transform="translate(195, 135)">
    <circle cx="15" cy="15" r="14" fill="#14B8A6" fill-opacity="0.12"/>
    <path d="M15 8 L16.5 13.5 L22 15 L16.5 16.5 L15 22 L13.5 16.5 L8 15 L13.5 13.5 Z" fill="#14B8A6"/>
    
    <circle cx="55" cy="30" r="12" fill="#5B5BD6" fill-opacity="0.12"/>
    <path d="M55 24 L56.2 28.8 L61 30 L56.2 31.2 L55 36 L53.8 31.2 L49 30 L53.8 28.8 Z" fill="#5B5BD6"/>
  </g>
</svg>

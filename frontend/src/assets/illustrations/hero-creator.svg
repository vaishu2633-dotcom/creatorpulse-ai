<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" fill="none">
  <!-- Creator with Laptop, Tripod Camera & Potted Plant -->
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Soft organic glow background -->
  <path d="M70 150 C60 60, 190 20, 310 40 C430 60, 440 210, 370 260 C280 310, 80 270, 70 150 Z" fill="url(#heroBg)"/>

  <!-- Studio Floor & Desk Shadow -->
  <ellipse cx="230" cy="265" rx="190" ry="18" fill="#CBD5E1" fill-opacity="0.45"/>

  <!-- CAMERA ON TRIPOD (Left side) -->
  <g id="tripod-camera">
    <!-- Legs -->
    <line x1="85" y1="165" x2="45" y2="265" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="165" x2="85" y2="265" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="165" x2="125" y2="265" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="85" cy="165" rx="12" ry="5" fill="#1E293B"/>
    <!-- Center column & Mount -->
    <rect x="82" y="140" width="6" height="25" rx="2" fill="#64748B"/>
    <!-- Camera Body -->
    <rect x="62" y="115" width="46" height="30" rx="6" fill="url(#camGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="74" y="108" width="14" height="7" rx="2" fill="#475569"/>
    <!-- Camera Lens -->
    <rect x="108" y="121" width="14" height="18" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="85" cy="130" r="8" fill="#0284C7" fill-opacity="0.8"/>
    <circle cx="87" cy="128" r="3" fill="#E0F2FE"/>
    <!-- Recording Red Dot -->
    <circle cx="69" cy="122" r="2.5" fill="#EF4444"/>
  </g>

  <!-- POTTED PLANT (Right side) -->
  <g id="plant">
    <!-- Pot -->
    <polygon points="360,215 390,215 383,260 367,260" fill="#EA580C"/>
    <ellipse cx="375" cy="215" rx="16" ry="4" fill="#C2410C"/>
    <!-- Leaves -->
    <path d="M375 212 C365 180, 335 185, 340 165 C355 175, 370 195, 375 212 Z" fill="url(#plantGrad)"/>
    <path d="M375 212 C385 175, 415 180, 410 160 C395 170, 380 195, 375 212 Z" fill="#34D399"/>
    <path d="M375 212 C370 170, 385 155, 375 145 C365 160, 370 190, 375 212 Z" fill="#059669"/>
  </g>

  <!-- CREATOR WITH LAPTOP (Center) -->
  <g id="creator">
    <!-- Body / Hoodie -->
    <path d="M185 255 L185 200 C185 182, 275 182, 275 200 L275 255 Z" fill="url(#bodyGrad)"/>
    <!-- White Inner Collar -->
    <path d="M215 185 Q230 205 245 185" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Neck & Head -->
    <rect x="220" y="165" width="20" height="22" rx="5" fill="#FCD34D"/>
    <circle cx="230" cy="140" r="30" fill="#FCD34D"/>

    <!-- Hair -->
    <path d="M202 140 C200 110, 258 100, 260 135 C248 122, 218 122, 208 142 Z" fill="#1E293B"/>
    <circle cx="201" cy="138" r="4.5" fill="#1E293B"/>
    <circle cx="259" cy="138" r="4.5" fill="#1E293B"/>

    <!-- Friendly Eyes & Smile -->
    <circle cx="221" cy="140" r="3" fill="#1E293B"/>
    <circle cx="239" cy="140" r="3" fill="#1E293B"/>
    <path d="M224 148 Q230 156 236 148" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="215" cy="146" r="3" fill="#FCA5A5" fill-opacity="0.8"/>
    <circle cx="245" cy="146" r="3" fill="#FCA5A5" fill-opacity="0.8"/>

    <!-- Headphones -->
    <path d="M200 135 C198 112, 262 112, 260 135" stroke="#6366F1" stroke-width="4" stroke-linecap="round" fill="none"/>
    <rect x="196" y="130" width="8" height="15" rx="3" fill="#4338CA"/>
    <rect x="256" y="130" width="8" height="15" rx="3" fill="#4338CA"/>

    <!-- Laptop Desk Stand & Open Laptop -->
    <rect x="180" y="222" width="100" height="25" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <polygon points="170,247 290,247 280,253 180,253" fill="#94A3B8"/>
    <!-- Screen glow with creator analytics -->
    <rect x="210" y="227" width="40" height="15" rx="2" fill="#6366F1" fill-opacity="0.2"/>
    <line x1="214" y1="233" x2="228" y2="233" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="214" y1="237" x2="242" y2="237" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Ambient Sparkles -->
  <g id="sparkles">
    <path d="M150 70 Q152 60 154 70 Q164 72 154 74 Q152 84 150 74 Q140 72 150 70 Z" fill="#F59E0B"/>
    <path d="M320 80 Q322 72 324 80 Q332 82 324 84 Q322 92 320 84 Q312 82 320 80 Z" fill="#8B5CF6"/>
    <circle cx="130" cy="110" r="3.5" fill="#38BDF8"/>
    <circle cx="330" cy="140" r="3.5" fill="#34D399"/>
  </g>
</svg>
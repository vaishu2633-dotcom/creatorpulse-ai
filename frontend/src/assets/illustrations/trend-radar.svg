<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5B5BD6" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" rx="20" fill="url(#radarBg)"/>

  <!-- Radar Rings -->
  <circle cx="160" cy="120" r="85" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="160" cy="120" r="60" stroke="#CBD5E1" stroke-width="1.5" opacity="0.8"/>
  <circle cx="160" cy="120" r="35" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Crosshairs -->
  <line x1="75" y1="120" x2="245" y2="120" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="160" y1="35" x2="160" y2="205" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Radar Sweep Cone -->
  <path d="M160 120 L220 60 A85 85 0 0 1 245 120 Z" fill="url(#sweepGrad)"/>

  <!-- Blips & Bubbles -->
  <circle cx="160" cy="120" r="6" fill="#14B8A6"/>
  <circle cx="195" cy="85" r="14" fill="#5B5BD6" fill-opacity="0.85"/>
  <circle cx="195" cy="85" r="5" fill="#FFFFFF"/>
  <circle cx="115" cy="95" r="10" fill="#EC4899" fill-opacity="0.85"/>
  <circle cx="115" cy="95" r="3.5" fill="#FFFFFF"/>
  <circle cx="215" cy="140" r="12" fill="#3B82F6" fill-opacity="0.85"/>
  <circle cx="215" cy="140" r="4" fill="#FFFFFF"/>
  <circle cx="130" cy="155" r="9" fill="#10B981" fill-opacity="0.85"/>

  <!-- Rising Momentum Indicator -->
  <g transform="translate(60, 45)">
    <rect width="64" height="26" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M14 18 L19 11 L23 14 L28 8" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 8 H28 V12" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="10" width="20" height="5" rx="2.5" fill="#64748B"/>
  </g>
</svg>
